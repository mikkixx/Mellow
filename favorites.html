<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Mansalva&display=swap" rel="stylesheet">
    <title>Избранное — Mellow</title>
</head>
<body>
    <header>
        <div class="logo-menu">
            <img src="img/menu.png" alt="" class="menu-icon">
            <a href="index.html" class="logo">Mellow</a>
        </div>
        <nav class="header">
            <a href="catalog.html">Каталог</a>
            <a href="about.html">О нас</a>
        </nav>
        <div class="header-icons">
            <a href="cart.html">
                <img src="img/cart.png" alt="Корзина">
            </a>
            <a href="favorites.html">
                <img src="img/heart.png" alt="Избранное">
            </a>
            <a href="profile.html">
                <img src="img/account.png" alt="Аккаунт">
            </a>
        </div>
    </header>

    <main class="catalog">
        <div class="women">
            <h2>Избранное</h2>
            <div class="favorites-grid">
                <div class="card">
                    <div class="image">
                        <img src="img/card2.png" alt="Кардиган и брюки">
                        <div class="add-cart">
                            <img src="img/plus.png" alt="В корзину">
                        </div>
                    </div>
                    <div class="info">
                        <div class="info-card">
                            <p>Кардиган и брюки «Mellow Base»</p>
                            <span>4 999 ₽</span>
                        </div>
                        <img src="img/like.png" alt="Удалить из избранного" class="like-active">
                    </div>
                </div>

                <div class="card">
                    <div class="image">
                        <img src="img/card3.png" alt="Худи оверсайз">
                        <div class="add-cart">
                            <img src="img/plus.png" alt="В корзину">
                        </div>
                    </div>
                    <div class="info">
                        <div class="info-card">
                            <p>Худи оверсайз «Теплый вечер»</p>
                            <span>3 200 ₽</span>
                        </div>
                        <img src="img/like.png" alt="Удалить из избранного" class="like-active">
                    </div>
                </div>

                <div class="card">
                    <div class="image">
                        <img src="img/hoodies.png" alt="Толстовка с капюшоном">
                        <div class="add-cart">
                            <img src="img/plus.png" alt="В корзину">
                        </div>
                    </div>
                    <div class="info">
                        <div class="info-card">
                            <p>Толстовка с капюшоном «Прогулка»</p>
                            <span>3 500 ₽</span>
                        </div>
                        <img src="img/like.png" alt="Удалить из избранного" class="like-active">
                    </div>
                </div>
            </div>
            <div class="more" style="margin-top: 50px;">
                <button type="submit">
                    <p>Смотреть все товары</p>
                    <img src="img/arrow-right.png" alt="">
                </button>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-column">
            <h3>Помощь</h3>
            <a href="#">Оплата</a>
            <a href="#">Доставка</a>
            <a href="#">Обмен и возврат</a>
        </div>
        <div class="footer-column">
            <h3>Компания</h3>
            <a href="about.html #about-company">О компании</a>
            <a href="#">Магазины</a>
            <a href="#">Скачать приложение</a>
        </div>
        <div class="contacts">
            <div class="footer-contacts">
                <p>Сыктывкар <img src="img/pin.png" alt=""></p>
                <p>+7 (904) 235 97 34</p>
            </div>
            <div class="footer-social">
                <img src="img/instagram.png" alt="">
                <img src="img/telegram.png" alt="">
            </div>
        </div>
    </footer>
</body>
</html>
